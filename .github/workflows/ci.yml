name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]

    steps:
      - uses: actions/checkout@v6

      # The .NET 10 SDK builds both targets and supports the .slnx solution.
      # Install both runtimes so tests execute on the requested target.
      - name: Setup .NET SDK and runtimes
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release --warnaserror

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --framework ${{ matrix.framework }} --filter "Category!=Integration" --verbosity normal --logger trx --results-directory ./TestResults/${{ matrix.framework }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.framework }}
          path: ./TestResults/${{ matrix.framework }}/*.trx

  # Run live-provider tests once, separately from deterministic release gates.
  integration:
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run integration tests on .NET 10
        run: dotnet test --configuration Release --framework net10.0 --filter "Category=Integration" --verbosity normal

  pack:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack --configuration Release --output ./artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

  publish:
    runs-on: ubuntu-latest
    needs: pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Publish the exact packages produced (and validated) by the pack job.
      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
